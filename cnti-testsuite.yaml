---
# CNTi Test Suite configuration for the kubernetes-ingress chart, installed
# with its defaults.
config_version: "v2"
common:
  container_names:
    # Released image tags next to the chart's appVersion (3.2.16), for the
    # rolling update, downgrade and rollback tests.
    - name: kubernetes-ingress-controller
      rolling_update_test_tag: "3.2.15"
      rolling_downgrade_test_tag: "3.1.16"
      rolling_version_change_test_tag: "3.2.15"
      rollback_from_tag: "3.2.15"
deployments:
  helm_dirs:
    - name: haproxy-ingress
      helm_directory: kubernetes-ingress
      namespace: haproxy-cnti
